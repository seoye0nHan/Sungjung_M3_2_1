<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성정중 3학년 국어 1회고사 직전 자료 – 함정 총정리</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#2b3145;--sub:#6b7186;--line:#eadfc8;--mint:#d7f5e6;--mintd:#1f8f63;--sky:#dcecff;--skyd:#2a6fd1;--peach:#ffe3d6;--peachd:#d2582c;--butter:#fff1b8;--butterd:#a67c00;--pink:#ffdff0;--pinkd:#c23f8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d2033;--card:#272b42;--ink:#f1f2f8;--sub:#a7abc4;--line:#3a3f5c;--mint:#1d4a3a;--mintd:#7be0b0;--sky:#1f3a63;--skyd:#8fc0ff;--peach:#5a3325;--peachd:#ffab8a;--butter:#584a12;--butterd:#ffe27a;--pink:#57284a;--pinkd:#ff9ed6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d2033;--card:#272b42;--ink:#f1f2f8;--sub:#a7abc4;--line:#3a3f5c;--mint:#1d4a3a;--mintd:#7be0b0;--sky:#1f3a63;--skyd:#8fc0ff;--peach:#5a3325;--peachd:#ffab8a;--butter:#584a12;--butterd:#ffe27a;--pink:#57284a;--pinkd:#ff9ed6}
html{scroll-behavior:smooth;scroll-padding-top:12px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3,h4{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;margin:0}
header{text-align:center;padding:28px 12px 8px}header p{color:var(--sub);margin:0}
.badge{display:inline-block;background:var(--butter);color:var(--butterd);border-radius:99px;padding:4px 14px;font-weight:700;font-size:14px}
h1{font-size:clamp(28px,7vw,40px);margin:12px 0 6px;line-height:1.25}.mascot{font-size:54px;line-height:1}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0 8px}
nav a{background:var(--card);border:2px solid var(--line);color:var(--ink);text-decoration:none;border-radius:99px;padding:4px 12px;font-size:14px;font-weight:500}
nav a:focus-visible,summary:focus-visible{outline:3px solid var(--skyd);outline-offset:2px}
section{margin-top:32px}h2{font-size:26px;margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:20px;margin-bottom:8px}.card p{margin:4px 0}
.tip,.warn{border-radius:16px;padding:10px 14px;margin:10px 0 0;font-weight:500}
.tip{background:var(--butter)}.tip b{color:var(--butterd)}.warn{background:var(--peach)}.warn b{color:var(--peachd)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}.s{flex:1 1 200px}
u{text-decoration:none;background:linear-gradient(transparent 60%,var(--butter) 60%);font-weight:700}
.t{font-size:13px;font-weight:700;border-radius:99px;padding:2px 11px}
.a{background:var(--sky);color:var(--skyd)}.b{background:var(--mint);color:var(--mintd)}.c{background:var(--peach);color:var(--peachd)}.d{background:var(--pink);color:var(--pinkd)}.e{background:var(--butter);color:var(--butterd)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vs>div{border-radius:16px;padding:10px 14px}
.vs .x{background:var(--sky)}.vs .y{background:var(--mint)}.vs h4{font-size:18px;margin-bottom:4px}.vs p{font-size:15px}
@media(max-width:480px){.vs{grid-template-columns:1fr}}
details{border-top:1px dashed var(--line);padding:6px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;gap:8px;align-items:baseline;border-radius:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"정답 보기";margin-left:auto;font-size:12px;font-weight:700;background:var(--sky);color:var(--skyd);border-radius:99px;padding:1px 10px;white-space:nowrap}
details[open] summary::after{content:"닫기";background:var(--line);color:var(--sub)}
summary .n{font-family:"Jua",sans-serif;color:var(--pinkd)}
.ans{margin:6px 0 4px 26px;color:var(--sub);font-size:15px}.ans b{color:var(--ink)}
.final{background:var(--pink);border:2px solid var(--pinkd);border-radius:20px;padding:15px 17px;margin-top:12px}
footer{text-align:center;color:var(--sub);margin-top:40px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="mascot">📚✏️</div>
<span class="badge">2026 · 성정중 3학년 1회고사</span>
<h1>국어 직전 자료<br>함정 총정리</h1>
<p>“아는 것 같은데 틀리는 것”만 골라 담았어요</p>
<nav id="nav"></nav>
</header>
<div id="app"></div>
<footer>🍀 시험 잘 보세요!<br>학교 프린트·수업 강조 내용이 이 자료보다 우선이에요.</footer>
</div>
<script>
var R=function(s,t,c){return '<div class="row"><span class="s">'+s+'</span><span class="t '+c+'">'+t+'</span></div>'};
var rows=function(a){return a.map(function(x){return R(x[0],x[1],x[2])}).join('')};
var tip=function(t){return '<div class="tip"><b>핵심</b> '+t+'</div>'};
var warn=function(t){return '<div class="warn"><b>함정!</b> '+t+'</div>'};
var V=function(h1,l1,h2,l2){var p=function(l){return l.map(function(x){return '<p>'+x+'</p>'}).join('')};return '<div class="vs"><div class="x"><h4>'+h1+'</h4>'+p(l1)+'</div><div class="y"><h4>'+h2+'</h4>'+p(l2)+'</div></div>'};
var C=function(h,b){return '<div class="card">'+(h?'<h3>'+h+'</h3>':'')+b+'</div>'};
var Q=function(a){return a.map(function(x,i){return '<details><summary><span class="n">'+(i+1)+'</span><span>'+x[0]+'</span></summary><p class="ans">'+x[1]+'</p></details>'}).join('')};

var S=[
["s1","꺼삐딴 리","📖",
C("기본 정보","<p>전광용 / 단편·풍자 소설 / <b>전지적 작가 시점</b> / <b>역순행적 구성</b>(현재→회상→현재) / 주인공 이인국(외과 의사)</p><p><b>주제:</b> 시대가 바뀔 때마다 자신의 이익만 좇는 기회주의적 삶 비판</p>"+tip("겉모습은 친일→친소→친미로 계속 변하지만, 변하지 않는 본질은 <u>자기 이익과 출세</u>예요."))+
C("시대별 사건 (시험에서 시기 구분 문제!)",rows([
["<u>국어 상용의 가</u> 액자, 춘석의 입원 거부","일제강점기 · 친일","a"],
["액자를 숨기고 증서를 찢음, 처벌 걱정","광복 직후","c"],
["춘석의 문초 → 감방 → 노어 공부 → 스텐코프 혹 제거 수술 → 석방","소련군 주둔 · 친소","b"],
["북에서 남한으로 내려옴, 병원 원장","1·4 후퇴 이후","e"],
["브라운에게 청자 화병 선물, 딸 나미 문제로 미국행 추진","6·25 이후(현재) · 친미","d"]
])+warn("스텐코프(소련군 장교)는 <u>광복 이후 북한</u>, 브라운(미국 대사관)은 <u>6·25 이후 남한</u>이에요. 같은 시기로 묶은 선지는 오답!"))+
C("제목 ‘꺼삐딴 리’의 의미",rows([["<u>꺼삐딴</u>","Captain(캡틴)의 러시아식 발음","a"],["<u>리</u>","이인국의 성","b"],["누가 부르나?","수술에 성공한 뒤 스텐코프가 부름","c"],["호칭의 뜻","소련군 장교에게 인정받았다는 증표","e"]])+tip("이인국은 <u>소련 권력에 적응해 얻은 호칭</u>을 제목으로 삼아, 시대마다 권력에 맞춰 변신하는 기회주의적 삶을 풍자해요. 본인은 이 호칭을 성공의 증표로 여기는데, 독자는 그 모습을 비판적으로 보게 되는 것이 풍자 효과예요.")+warn("‘꺼삐딴’은 이인국의 직책이 아니에요. 소련 권력에게 받은 호칭이에요."))+C("헷갈리는 짝 비교",V("춘석",["일제강점기 입원 거부당한 사상범","광복 후 이인국을 문초","과거의 잘못을 돌려주는 인물"],"스텐코프",["소련군 장교, <b>혹 제거 수술</b>","수술 후 호의 → 석방","‘꺼삐딴 리’ 호칭의 주인","새 권력에 적응하게 한 인물"])+"<p></p>"+rows([
["<u>국어 상용의 가</u>","적극적 친일의 증거 (‘국어’=일본어)","a"],
["<u>회중시계</u>","제국 대학 졸업 상품, 과거 회상의 매개","b"],
["<u>노어책</u>","소련 권력에 적응하려는 생존 수단","c"],
["<u>청자 화병</u>","브라운에게 주는 선물 = 처세술","d"],
["<u>적기</u>","소련 국기 → 소련 권력(친소 시기)","c"],
["<u>성조기</u>","미국 국기 → 미국 권력(친미 시기)","a"]
])+warn("‘국어’를 우리말로 읽으면 안 돼요. 일제강점기엔 일본어를 가리키는 말이었어요."))+
C("지문 표현 → 심리 해석",rows([
["‘무엇인가 닥쳐올 사태를 오돌오돌 떨면서 대기’","친일이 드러나 처벌받을까 두려움","c"],
["‘나야 원 괜찮겠지’","자기에게만 유리한 막연한 기대","e"],
["‘뉘우침이나 가책 같은 건 아예 있을 수 없었다’","반성 없음 (자기 합리화)","d"],
["증서를 꼼꼼히 찢음","친일 증거 은폐","c"],
["‘나의 처세법은 유에스에이에도 통하는구나’","처세술에 대한 자부심·만족","b"]
])+tip("광복 직후 심리 = <u>기쁨 ✕ / 불안·두려움 ○</u>, 반성 ✕"))+
C("OX 함정",Q([
["이인국은 광복을 기뻐하며 과거를 반성했다.","<b>X</b> — 처벌이 두렵고 가책도 없었어요."],
["이인국이 노어를 공부한 것은 러시아 문학에 대한 관심 때문이다.","<b>X</b> — 감방에서 살아남고 권력에 적응하려는 수단이에요."],
["스텐코프는 급성 맹장염 수술을 받았다.","<b>X</b> — 스텐코프는 혹 제거 수술을 받았어요."],
["이인국은 의술이 뛰어나므로 긍정적 인물로 그려진다.","<b>X</b> — 능력보다 그 능력을 <u>이기적 목적</u>에 쓰는 점이 비판 대상이에요."],
["제목 ‘꺼삐딴 리’는 소련 권력에 적응해 얻은 호칭으로, 기회주의를 풍자한다.","<b>O</b>"],
["인물의 속마음이 드러나므로 1인칭 주인공 시점이다.","<b>X</b> — 전지적 작가 시점이에요."]]))+
C("서술형 모범 답안","<p><b>Q. 작가가 이인국을 통해 비판하는 삶의 태도는?</b></p><p>시대와 권력이 바뀔 때마다 신념을 지키기보다 자신에게 유리한 세력에 맞추어 태도를 바꾸는 기회주의적·이기적 삶의 태도를 비판한다.</p>")],

["s2","이옥설","🏠",
C("기본 정보","<p>이규보 / 고려 중기 / 고전 수필·한문 수필 / <b>설(說)</b> / 제재: 퇴락한 행랑채 수리 경험</p><p><b>설:</b> 사물·사건의 이치를 풀이하고 자기 의견을 덧붙여 교훈을 전하는 한문 산문</p><p><b>주제:</b> 잘못을 알았을 때 즉시 고쳐 나가는 자세의 중요성</p>")+
C("집 수리: 두 칸 vs 한 칸",V("두 칸 (방치)",["오래전부터 비가 샘","서까래·추녀·기둥·들보까지 썩음","수리 비용 많이 듦","재목을 쓰기 어려움"],"한 칸 (즉시 수리)",["비가 한 번 샘","바로 기와를 갈아 줌","재목 온전, 비용 적음","재목을 다시 씀"])+warn("세 칸 <u>모두</u> 오래 샜다(X). 두 칸은 방치, 한 칸은 즉시 수리! 한 칸의 재목이 원래 튼튼했던 게 아니라 <u>빨리 고쳐서</u> 온전했던 거예요."))+
C("유추: 집 → 사람 → 나라",rows([
["집: 비가 샘 → 방치하면 재목이 썩음","경험","a"],
["사람: 잘못을 알고도 안 고치면 나쁜 사람이 됨","적용","b"],
["나라: 백성을 해치는 폐단을 방치하면 나라가 위태로움","확장","c"]
])+tip("공통 원리 = 문제를 <u>즉시 바로잡지 않으면 커져서 해결하기 어렵다</u>"))+
C("유추 vs 비유 vs 귀납 vs 연역",rows([
["두 대상의 유사성을 바탕으로 한쪽 원리를 다른 쪽에 적용","유추","d"],
["어떤 대상을 다른 대상에 빗대어 표현","비유","a"],
["여러 사례 → 일반적 결론","귀납","b"],
["일반 원리 → 개별 사례의 결론","연역","c"]
])+warn("‘경험에서 깨달음을 얻었다’만으로는 유추가 아니에요. <u>서로 다른 대상 사이의 유사성</u>을 바탕으로 원리를 확장했다는 점이 핵심!"))+
C("설의법 판별",rows([
["<u>어찌 삼가지 않겠는가</u> (당연히 삼가야 한다)","설의법 ○","b"],
["<u>어디에 갔니?</u> (답을 묻는 질문)","일반 의문문 ✕","c"]
])+tip("마지막 문장은 글쓴이의 의문·혼란이 아니라 <u>경계를 촉구하는 강조</u>예요."))+
C("OX 함정",Q([
["잘못을 전혀 저지르지 않는 완벽한 삶을 강조한다.","<b>X</b> — 잘못을 깨달았을 때 바로 고치는 태도를 강조해요."],
["잘못을 고치는 일은 개인의 삶에만 적용된다.","<b>X</b> — 나라의 정치로 확장돼요."],
["추상적 주장을 먼저 제시한 뒤 경험을 설명한다.","<b>X</b> — 구체적 경험 → 깨달음 순서예요."],
["‘설’은 일반 수필과 완전히 별개의 갈래다.","<b>X</b> — 고전 수필에 속하면서 한문 ‘설’의 특성을 지녀요."]]))+
C("서술형 모범 답안","<p><b>Q. 마지막에 나라의 정치를 언급한 이유는?</b></p><p>잘못을 즉시 고쳐야 한다는 깨달음을 개인에서 국가로 확장해, 백성에게 해로운 문제를 방치하지 말고 일찍 바로잡아야 함을 강조하기 위해서이다.</p>")],

["s3","까마귀 눈비 맞아","🐦‍⬛",
C("기본 정보","<p>박팽년 / 고시조·평시조(3장 4음보) / 성격: 절의적·의지적</p><p><b>배경:</b> 수양대군이 계유정난 후 왕위에 올라 세조가 됨 → 박팽년은 단종 복위를 꾀하다 처형된 사육신</p><p><b>주제:</b> 단종에 대한 변함없는 충절</p>")+
C("시어 → 의미",rows([
["<u>까마귀</u>","세조에 동조한 간신·변절자","c"],
["<u>눈비</u>","겉모습을 잠시 바꾸는 외부 상황","e"],
["<u>밤</u>","왕위 찬탈로 인한 부정적 현실","d"],
["<u>야광명월</u>","어둠 속에서도 빛나는 충신의 절개","b"],
